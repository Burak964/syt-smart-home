services:
  reverse-proxy:
    image: nginx:1.30.6-alpine
    container_name: smart-home-reverse-proxy
    restart: unless-stopped
    ports:
      - "192.168.71.131:80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx-grafana/default.conf:/etc/nginx/conf.d/default.conf:ro
