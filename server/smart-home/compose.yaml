services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: smart-home-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data

  node-red:
    image: nodered/node-red:latest
    container_name: smart-home-node-red
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "192.168.71.131:1880:1880"
    volumes:
      - node_red_data:/data

  influxdb:
    image: influxdb:2.9.1-alpine
    container_name: smart-home-influxdb
    restart: unless-stopped
    ports:
      - "192.168.71.131:8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

volumes:
  mosquitto_data:
  node_red_data:
  influxdb_data:
  influxdb_config:
