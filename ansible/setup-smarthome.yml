---
- name: Smart Home Monitoring Server automatisiert einrichten (SYT EKv)
  hosts: smarthome_server
  become: true
  vars:
    project_user: burakbaba
    base_dir: /home/burakbaba/smart-home
    monitoring_dir: /home/burakbaba/monitoring
    vm_ip: 192.168.71.131

  tasks:
    - name: Benötigte Systempakete sicherstellen
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Docker-Dienst aktivieren und starten
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Projektverzeichnisse anlegen
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: "0755"
      loop:
        - "{{ base_dir }}"
        - "{{ base_dir }}/mosquitto/config"
        - "{{ base_dir }}/nginx-grafana"
        - "{{ monitoring_dir }}"

    - name: Smart-Home Docker Compose Datei bereitstellen
      ansible.builtin.copy:
        dest: "{{ base_dir }}/compose.yaml"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: "0644"
        content: |
          services:
            mosquitto:
              image: eclipse-mosquitto:latest
              container_name: smart-home-mosquitto
              restart: unless-stopped
              ports:
                - "1883:1883"
              volumes:
                - ./mosquitto/config:/mosquitto/config:ro
                - mosquitto_data:/mosquitto/data

            node-red:
              image: nodered/node-red:latest
              container_name: smart-home-node-red
              restart: unless-stopped
              depends_on:
                - mosquitto
              ports:
                - "{{ vm_ip }}:1880:1880"
              volumes:
                - node_red_data:/data

            influxdb:
              image: influxdb:2.9.1-alpine
              container_name: smart-home-influxdb
              restart: unless-stopped
              ports:
                - "{{ vm_ip }}:8086:8086"
              volumes:
                - influxdb_data:/var/lib/influxdb2
                - influxdb_config:/etc/influxdb2

          volumes:
            mosquitto_data:
            node_red_data:
            influxdb_data:
            influxdb_config:

    - name: Reverse-Proxy Override Datei bereitstellen
      ansible.builtin.copy:
        dest: "{{ base_dir }}/compose.override.yaml"
        owner: "{{ project_user }}"
        group: "{{ project_user }}"
        mode: "0644"
        content: |
          services:
            reverse-proxy:
              image: nginx:1.30.6-alpine
              container_name: smart-home-reverse-proxy
              restart: unless-stopped
              ports:
                - "{{ vm_ip }}:80:80"
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - ./nginx-grafana/default.conf:/etc/nginx/conf.d/default.conf:ro

    - name: Smart-Home Stack über Docker Compose starten
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ base_dir }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stderr or 'Created' in compose_result.stderr"

    - name: Monitoring Stack über Docker Compose starten
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ monitoring_dir }}"
      register: mon_result
      changed_when: "'Started' in mon_result.stderr or 'Created' in mon_result.stderr"
